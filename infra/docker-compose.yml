name: footconnect

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-footconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-footconnect}
      POSTGRES_DB: ${POSTGRES_DB:-footconnect}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-footconnect} -d ${POSTGRES_DB:-footconnect}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
